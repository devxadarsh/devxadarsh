<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="20" viewBox="0 0 1200 20" role="presentation">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity=".95"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-300%" width="200%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="9" width="1200" height="2" fill="url(#fade)"/>
  <g filter="url(#glow)">
    <rect x="-140" y="9" width="140" height="2" fill="url(#trail)">
      <animate attributeName="x" values="-140;1200" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur="5s" repeatCount="indefinite"/>
    </rect>
    <circle cy="10" r="2.6" fill="#67e8f9">
      <animate attributeName="cx" values="0;1200" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
